name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_VERSION_MAJOR: "6"
      QMAKE: /usr/bin/qmake6
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate Rust toolchain
        run: rustup show

      - name: Cache circuit artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/logos-blockchain-circuits
            ${{ runner.temp }}/logos-blockchain-circuits
          key: circuits-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-artifacts.json') }}
          restore-keys: |
            circuits-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Cargo registry and git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install minimal Qt 6 development packages
        run: |
          set -euo pipefail
          sudo apt-get update
          # qmake6 is required for cxx-qt discovery of the Qt installation.
          # declarative packages support the standalone GUI and QML static suite.
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            qmake6 \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-qmllint-plugins \
            qt6-tools-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            qml6-module-qttest \
            libgl1-mesa-dev
          test -x /usr/bin/qmake6
          test -x /usr/lib/qt6/bin/qmllint
          test -x /usr/lib/qt6/bin/qmltestrunner
          # Append rather than replace PATH so rustup/cargo remain available.
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
          /usr/bin/qmake6 -query QT_VERSION
          /usr/bin/qmake6 -query QT_INSTALL_LIBS

      - name: Policy checks
        run: python3 scripts/check-build-pipeline.py ci-policy

      - name: Generated sources and circuits
        run: python3 scripts/check-build-pipeline.py ci-generated

      - name: Rust workspace Clippy and tests
        run: python3 scripts/check-build-pipeline.py ci-rust

      - name: Native CMake/CTest suite
        run: python3 scripts/check-build-pipeline.py ci-native

      - name: Web UI checks
        run: python3 scripts/check-build-pipeline.py ci-web

      - name: QML static and unit checks
        run: python3 scripts/check-build-pipeline.py ci-qml-static

      - name: QML visual suite
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/check-build-pipeline.py ci-qml-visual
